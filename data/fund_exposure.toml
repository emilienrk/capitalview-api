# What each fund is exposed to, kept by hand.
#
# Synced into the `fund_exposures` table at startup: edit, commit, deploy.
# Keyed by ISIN (the asset_key used everywhere else).
#
# Rules
# - Weights are ratios (0.25 = 25 %). They may sum to less than 1: whatever is
#   not listed is shown as « Autre », never spread over the listed ones.
# - Countries: ISO 3166 alpha-2 codes.
# - Sectors: one of technology, communication, health_care, financials,
#   real_estate, consumer_discretionary, consumer_staples, industrials,
#   materials, energy, utilities — the 11 GICS sectors. Stick to GICS: ICB
#   (STOXX, Nasdaq factsheets) puts Alphabet and Meta under technology.
#   For an index whose provider publishes ICB only, a physical iShares ETF on
#   the same index gives its GICS breakdown.
# - Synthetic (swap) ETFs: take the weights of the INDEX they track, from the
#   index provider's factsheet. Never the fund's holdings file: it lists the
#   substitute basket, not the exposure.
# - Every block carries the date of its data and where it was read.

