name: API CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      ENV: test
      SECRET_KEY: test-secret-key-for-ci-only-not-for-production-use
      DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
      ENCRYPTION_KEY: test-encryption-key-for-ci-only-32bytes-minimum-length
      CMC_API_KEY: test-cmc-api-key
      CG_API_KEY: test-cg-api-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.14'
          enable-cache: true

      # --frozen so the run fails on a stale lockfile rather than silently
      # testing a resolution the image will never ship.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run --frozen pytest -v --tb=short
